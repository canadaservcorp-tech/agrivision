; ============================================================
; AgriVision ESP32-S3 Camera Node — Production Build
; ============================================================
; Board: ESP32-S3 with OV5640 camera + MicroSD
; Flash single: pio run -t upload
; Batch: python scripts/batch_flash.py --count 10
; ============================================================

[env:agrivision-cam]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino

board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_size = 16MB
board_build.partitions = partitions_ota.csv
board_build.arduino.memory_type = qio_opi

build_flags = 
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
    ; Camera pins (ESP32-S3-CAM / Freenove)
    -DCAM_PIN_PWDN=-1
    -DCAM_PIN_RESET=-1
    -DCAM_PIN_XCLK=15
    -DCAM_PIN_SIOD=4
    -DCAM_PIN_SIOC=5
    -DCAM_PIN_D7=16
    -DCAM_PIN_D6=17
    -DCAM_PIN_D5=18
    -DCAM_PIN_D4=12
    -DCAM_PIN_D3=10
    -DCAM_PIN_D2=8
    -DCAM_PIN_D1=9
    -DCAM_PIN_D0=11
    -DCAM_PIN_VSYNC=6
    -DCAM_PIN_HREF=7
    -DCAM_PIN_PCLK=13
    ; Hardware pins
    -DLED_PIN=2
    -DRESET_BTN_PIN=0
    -DBATT_ADC_PIN=1
    ; SD card (1-bit SDMMC)
    -DSD_CLK=39
    -DSD_CMD=38
    -DSD_D0=40
    ; Firmware version
    -DFW_VERSION='"1.2.0"'
    -DFW_BUILD_DATE='"2026-02-28"'

upload_protocol = esptool
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

lib_deps = 
    bblanchon/ArduinoJson@^7.2.0
