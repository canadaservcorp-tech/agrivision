# ============================================================
# AgriVision Hub Runtime Configuration
# ============================================================
# Edit this file to configure your hub.
# After editing, restart: sudo systemctl restart agrivision-hub
# ============================================================

# Hub identity (unique per hub — set by dealer during provisioning)
HUB_SERIAL=HUB-CHANGE-ME
FARM_ID=1

# Cloud backend
CLOUD_API_URL=https://api.theagrivision.com
CLOUD_API_KEY=

# WiFi Access Point (for camera nodes to connect)
AP_SSID=AgriVision-HUB
AP_PASSWORD=agri2026secure
AP_CHANNEL=6

# Internet uplink
# eth0 = Ethernet (preferred)
# wlan1 = USB WiFi dongle (if no Ethernet)
UPSTREAM_INTERFACE=eth0

# Camera receiver
RECEIVER_PORT=8080
MAX_IMAGE_SIZE_MB=10

# AI Detection
DETECTION_THRESHOLD=0.65

# Sensor reading interval (seconds)
SENSOR_INTERVAL=900

# Cloud sync interval (seconds)
SYNC_INTERVAL=300

# Fleet management
CAMERA_TIMEOUT=1800
OTA_ENABLED=true

# WhatsApp alerts (Twilio)
TWILIO_ACCOUNT_SID=
TWILIO_AUTH_TOKEN=
TWILIO_WHATSAPP_NUMBER=whatsapp:+14155238886
FARMER_WHATSAPP=

# Logging
LOG_LEVEL=INFO
LOG_MAX_SIZE_MB=50

# Data retention (days)
IMAGE_RETENTION_DAYS=30
DETECTION_RETENTION_DAYS=365

# Hardware
ENABLE_WEATHER_STATION=false
ENABLE_MULTISPECTRAL=false
ENABLE_LORAWAN=false

# USB SSD (leave empty if not using external storage)
USB_SSD_UUID=
