# ============================================================
# AgriVision Hub — Kernel Tuning
# Append to /etc/sysctl.conf
# ============================================================

# Network performance (many camera connections)
net.core.somaxconn=512
net.core.netdev_max_backlog=5000
net.ipv4.tcp_max_syn_backlog=1024
net.ipv4.ip_forward=1

# Memory management (AI inference)
vm.swappiness=10
vm.dirty_ratio=20
vm.dirty_background_ratio=5

# File descriptors (many simultaneous camera uploads)
fs.file-max=65535
fs.inotify.max_user_watches=65535
