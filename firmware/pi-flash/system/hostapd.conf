# ============================================================
# AgriVision Hub — WiFi Access Point Configuration
# Camera nodes connect to this AP to send images
# ============================================================
interface=wlan0
driver=nl80211
ssid=AgriVision-HUB
hw_mode=g
channel=6
wmm_enabled=0
macaddr_acl=0
auth_algs=1
ignore_broadcast_ssid=0
wpa=2
wpa_passphrase=agri2026secure
wpa_key_mgmt=WPA-PSK
wpa_pairwise=TKIP
rsn_pairwise=CCMP

# Allow max 25 camera nodes
max_num_sta=25

# Country code (change to your region)
country_code=AE
