# ============================================================
# AgriVision Hub — Network Configuration
# Append to /etc/dhcpcd.conf
# ============================================================

# Static IP for WiFi AP interface (camera nodes connect here)
interface wlan0
    static ip_address=192.168.4.1/24
    nohook wpa_supplicant

# Ethernet for internet uplink (DHCP)
interface eth0
    # Uses DHCP by default — no static config needed
