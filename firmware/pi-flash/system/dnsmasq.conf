# ============================================================
# AgriVision Hub — DHCP Server for Camera Nodes
# Assigns 192.168.4.x IPs to ESP32 cameras
# ============================================================
interface=wlan0
bind-dynamic
domain-needed
bogus-priv

# DHCP range: 192.168.4.10 - 192.168.4.250 (240 cameras max)
dhcp-range=192.168.4.10,192.168.4.250,255.255.255.0,24h

# Hub is the gateway and DNS
dhcp-option=3,192.168.4.1
dhcp-option=6,192.168.4.1

# Static address for hub
address=/hub.agrivision.local/192.168.4.1

# Log DHCP leases (camera discovery)
log-dhcp
log-facility=/home/agrivision/logs/dnsmasq.log

# Faster lease for cameras
dhcp-lease-max=250

# mDNS for auto-discovery
enable-ra
