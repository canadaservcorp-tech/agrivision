name: agrivision
description: AgriVision — AI-Powered Agricultural Monitoring
publish_to: "none"
version: 3.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  go_router: ^14.2.0
  flutter_riverpod: ^2.5.1
  dio: ^5.7.0
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2
  fl_chart: ^0.69.0
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  google_maps_flutter: ^2.9.0
  camera: ^0.11.0
  image_picker: ^1.1.2
  firebase_core: ^3.5.0
  firebase_messaging: ^15.1.1
  flutter_local_notifications: ^17.2.3
  intl: ^0.19.0
  url_launcher: ^6.3.0
  share_plus: ^10.0.3
  path_provider: ^2.1.4
  connectivity_plus: ^6.0.5
  flutter_stripe: ^11.1.0
  mobile_scanner: ^5.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
